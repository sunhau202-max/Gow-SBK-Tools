name: Build EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.10 dipilih supaya exe jalan mulus di Wine/Winlator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # 1) Versi utama: satu file exe tanpa jendela console
      - name: Build EXE (utama)
        run: python -m PyInstaller --noconfirm --onefile --windowed --name GoW_SBK_Tool gow_wad_sbk_tool.py

      # 2) Versi debug: ada jendela console, menampilkan error kalau gagal start
      - name: Build EXE (debug console)
        run: python -m PyInstaller --noconfirm --onefile --console --name GoW_SBK_Tool_debug --distpath dist_debug --workpath build_debug gow_wad_sbk_tool.py

      # 3) Versi folder: tidak mengekstrak ke temp, kadang lebih stabil di Winlator
      - name: Build folder (onedir)
        run: python -m PyInstaller --noconfirm --onedir --windowed --name GoW_SBK_Tool_folder --distpath dist_folder --workpath build_folder gow_wad_sbk_tool.py

      - uses: actions/upload-artifact@v4
        with:
          name: GoW_SBK_Tool
          path: dist/GoW_SBK_Tool.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GoW_SBK_Tool_debug
          path: dist_debug/GoW_SBK_Tool_debug.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GoW_SBK_Tool_folder
          path: dist_folder/GoW_SBK_Tool_folder/

      - name: Release (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GoW_SBK_Tool.exe
            dist_debug/GoW_SBK_Tool_debug.exe
