name: Build SBK Tools

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.10 dipilih supaya hasilnya jalan mulus di Wine/Winlator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # Versi FOLDER (onedir): tidak mengekstrak ke temp, stabil di Winlator
      - name: Build program (folder)
        run: python -m PyInstaller --noconfirm --onedir --windowed --name SBK_Tools --icon icon.ico gow_wad_sbk_tool.py

      # Versi debug dengan jendela console (menampilkan error kalau gagal start)
      - name: Build debug (console)
        run: python -m PyInstaller --noconfirm --onedir --console --name SBK_Tools_debug --icon icon.ico --distpath dist_debug --workpath build_debug gow_wad_sbk_tool.py

      # Rakit paket:  SBK Tools.zip
      #   Readme-Indo/Eng, Leia-me-Br, Informasi-Indo, Information-Eng, Informacoes-Br, Katalog_SBK
      #   SBK Tools\  (SBK_Tools.exe + DLL dan file pendukung)
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Path dist/SBK_Tools -Destination "stage/SBK Tools" -Recurse
          Copy-Item -Path Readme-Indo.txt, Readme-Eng.txt, Leia-me-Br.txt, Informasi-Indo.txt, Information-Eng.txt, Informacoes-Br.txt, Katalog_SBK.txt -Destination stage/
          Get-ChildItem stage | Format-Table Name

      - uses: actions/upload-artifact@v4
        with:
          name: SBK Tools
          path: stage/

      - uses: actions/upload-artifact@v4
        with:
          name: SBK Tools debug
          path: dist_debug/SBK_Tools_debug/

      - name: Zip for release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path "stage/*" -DestinationPath "SBK Tools.zip"

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SBK Tools.zip
